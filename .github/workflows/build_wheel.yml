name: Build Wheel

on:
  push:
    branches: [main, master, ci_wheel]
  pull_request:
  workflow_dispatch:

env:
  LLVM_TAG: llvmorg-19.1.7

jobs:
  build_wheel:
    name: Build wheel (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11"]
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install cibuildwheel
        run: pip install cibuildwheel==3.3.1

      - name: Cache LLVM build
        uses: actions/cache@v4
        with:
          path: /tmp/llvm-cache
          key: llvm-${{ env.LLVM_TAG }}-manylinux_2_34-${{ matrix.arch }}-v3

      - name: Build wheels with cibuildwheel
        env:
          CIBW_BUILD: "cp310-manylinux_${{ matrix.arch }} cp311-manylinux_${{ matrix.arch }}"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_34
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_34

          # Install system dependencies and build LLVM (runs once per platform)
          CIBW_BEFORE_ALL: |
            set -ex

            # Install system dependencies
            dnf install -y ninja-build cmake git ccache gcc-c++ lld zip
            dnf clean all

            # Paths
            WORKSPACE_DIR=/llvm-workspace
            LLVM_SOURCE_DIR=$WORKSPACE_DIR/llvm-project
            LLVM_BUILD_DIR=$LLVM_SOURCE_DIR/build-shared
            # Derive a manylinux Python version from the first CIBW_BUILD tag
            # Example: cp39-manylinux_x86_64 -> cp39-cp39
            PY_TAG=$(echo "$CIBW_BUILD" | awk '{print $1}' | cut -d- -f1)
            PY_VER="${PY_TAG}-${PY_TAG}"
            PY_PATH="/opt/python/${PY_VER}"
            PYTHON_BIN="${PY_PATH}/bin/python"
            PYTHON_ROOT="${PY_PATH}"

            # Ensure Python deps are available for LLVM/PTOAS config
            ${PYTHON_BIN} -m pip install --no-cache-dir numpy pybind11 nanobind setuptools wheel auditwheel

            # Check cache
            if [ -d "/host/tmp/llvm-cache/build-shared" ] && [ -f "/host/tmp/llvm-cache/build-shared/lib/cmake/mlir/MLIRConfig.cmake" ]; then
              echo "=== Restoring LLVM from cache ==="
              mkdir -p $LLVM_SOURCE_DIR
              cp -r /host/tmp/llvm-cache/build-shared $LLVM_BUILD_DIR
            else
              echo "=== Building LLVM from source ==="
              mkdir -p $WORKSPACE_DIR
              cd $WORKSPACE_DIR
              git clone --depth 1 --branch $LLVM_TAG https://github.com/llvm/llvm-project.git

              cd $LLVM_SOURCE_DIR
              cmake -G Ninja -S llvm -B $LLVM_BUILD_DIR \
                -DLLVM_ENABLE_PROJECTS="mlir;clang" \
                -DBUILD_SHARED_LIBS=ON \
                -DMLIR_ENABLE_BINDINGS_PYTHON=ON \
                -DPython3_ROOT_DIR=${PYTHON_ROOT} \
                -DPython3_EXECUTABLE=${PYTHON_BIN} \
                -DCMAKE_BUILD_TYPE=Release \
                -DLLVM_TARGETS_TO_BUILD="host"
              ninja -C $LLVM_BUILD_DIR

              # Save to cache
              echo "=== Saving LLVM to cache ==="
              mkdir -p /host/tmp/llvm-cache
              rm -rf /host/tmp/llvm-cache/build-shared
              cp -r $LLVM_BUILD_DIR /host/tmp/llvm-cache/build-shared
            fi

          # Build PTOAS for each Python version
          CIBW_BEFORE_BUILD: |
            set -ex

            # Install Python dependencies
            pip install numpy pybind11 nanobind setuptools wheel

            # Paths
            WORKSPACE_DIR=/llvm-workspace
            LLVM_BUILD_DIR=$WORKSPACE_DIR/llvm-project/build-shared
            PTO_SOURCE_DIR={project}
            PTO_INSTALL_DIR=$PTO_SOURCE_DIR/install
            PY_PACKAGE_DIR=$LLVM_BUILD_DIR/tools/mlir/python_packages/mlir_core

            # Build PTOAS
            cd $PTO_SOURCE_DIR
            rm -rf build install  # Clean previous build
            cmake -G Ninja \
              -S . \
              -B build \
              -DLLVM_DIR=$LLVM_BUILD_DIR/lib/cmake/llvm \
              -DMLIR_DIR=$LLVM_BUILD_DIR/lib/cmake/mlir \
              -DPython3_EXECUTABLE=$(which python) \
              -DPython3_FIND_STRATEGY=LOCATION \
              -Dpybind11_DIR=$(python -m pybind11 --cmakedir) \
              -DMLIR_PYTHON_PACKAGE_DIR=$PY_PACKAGE_DIR \
              -DCMAKE_INSTALL_PREFIX=$PTO_INSTALL_DIR
            ninja -C build
            ninja -C build install

            # Copy PTO dialect files to MLIR package directory
            cp $PTO_INSTALL_DIR/mlir/dialects/*.py $PY_PACKAGE_DIR/mlir/dialects/

            # Copy setup.py to package directory
            cp $PTO_SOURCE_DIR/docker/setup.py $PY_PACKAGE_DIR/

          CIBW_ENVIRONMENT: >
            LLVM_TAG=${{ env.LLVM_TAG }}
            WORKSPACE_DIR=/llvm-workspace
            LLVM_BUILD_DIR=/llvm-workspace/llvm-project/build-shared
            PTO_INSTALL_DIR={project}/install

          # Build from MLIR package directory
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
          
          # Override the package directory for wheel building
          CIBW_CONFIG_SETTINGS: ""

          # Repair wheel to bundle shared libraries
          CIBW_REPAIR_WHEEL_COMMAND: |
            export LD_LIBRARY_PATH=/llvm-workspace/llvm-project/build-shared/lib:{project}/install/lib:$LD_LIBRARY_PATH
            auditwheel repair --plat {delocate_plat} -w {dest_dir} {wheel}

          # Test the built wheel
          CIBW_TEST_COMMAND: |
            python -c "import mlir.ir; print('mlir.ir OK')"
            python -c "from mlir.dialects import pto; print('pto dialect OK')"

        run: |
          # Create a minimal setup.py at project root that delegates to MLIR package dir
          cat > setup.py << 'SETUP_EOF'
          import os
          import sys

          # Change to MLIR package directory where the actual package is
          py_package_dir = os.environ.get('LLVM_BUILD_DIR', '/llvm-workspace/llvm-project/build-shared')
          py_package_dir = os.path.join(py_package_dir, 'tools/mlir/python_packages/mlir_core')

          if os.path.isdir(py_package_dir):
              os.chdir(py_package_dir)
              # Re-execute setup.py from there
              exec(open('setup.py').read())
          else:
              print(f"ERROR: Package directory not found: {py_package_dir}", file=sys.stderr)
              sys.exit(1)
          SETUP_EOF

          cibuildwheel --output-dir wheelhouse

      - name: Collect ptoas binary and dependencies
        run: |
          # Run collection inside container to access the built artifacts
          docker run --rm \
            -v $PWD:/workspace:ro \
            -v /tmp/llvm-cache:/llvm-cache:ro \
            -v $PWD/ptoas-dist:/output:rw \
            quay.io/pypa/manylinux_2_34_${{ matrix.arch }} \
            bash -c '
              set -ex
              
              LLVM_BUILD_DIR=/llvm-workspace/llvm-project/build-shared
              PTO_SOURCE_DIR=/workspace
              PTO_INSTALL_DIR=$PTO_SOURCE_DIR/install
              
              # Restore LLVM build for ldd to work
              mkdir -p /llvm-workspace/llvm-project
              cp -r /llvm-cache/build-shared $LLVM_BUILD_DIR
              
              # Rebuild ptoas quickly (already compiled, just needs linking info)
              export PATH="/opt/python/cp311-cp311/bin:$PATH"
              pip install numpy pybind11 nanobind
              
              cd $PTO_SOURCE_DIR
              if [ ! -f build/tools/ptoas/ptoas ]; then
                dnf install -y ninja-build cmake gcc-c++ lld
                cmake -G Ninja \
                  -S . \
                  -B build \
                  -DLLVM_DIR=$LLVM_BUILD_DIR/lib/cmake/llvm \
                  -DMLIR_DIR=$LLVM_BUILD_DIR/lib/cmake/mlir \
                  -DPython3_EXECUTABLE=$(which python) \
                  -DPython3_FIND_STRATEGY=LOCATION \
                  -Dpybind11_DIR=$(python -m pybind11 --cmakedir) \
                  -DMLIR_PYTHON_PACKAGE_DIR=$LLVM_BUILD_DIR/tools/mlir/python_packages/mlir_core \
                  -DCMAKE_INSTALL_PREFIX=$PTO_INSTALL_DIR
                ninja -C build
              fi
              
              export LD_LIBRARY_PATH=$LLVM_BUILD_DIR/lib:$PTO_INSTALL_DIR/lib:$LD_LIBRARY_PATH
              
              PTOAS_BIN=$PTO_SOURCE_DIR/build/tools/ptoas/ptoas
              PTOAS_DEPS_DIR=/output/lib
              
              mkdir -p /output/bin $PTOAS_DEPS_DIR
              cp $PTOAS_BIN /output/bin/
              
              # Collect *.so dependencies
              copy_so() {
                local f="$1"
                [[ -f "$f" ]] || return 0
                local name=$(basename "$f")
                [[ -f "${PTOAS_DEPS_DIR}/${name}" ]] && return 0
                cp -n "$f" "${PTOAS_DEPS_DIR}/" 2>/dev/null || true
                while read -r res; do
                  copy_so "$res"
                done < <(ldd "$f" 2>/dev/null | awk "/=> \/llvm-workspace\// {print \$3}")
              }
              
              while read -r res; do
                copy_so "$res"
              done < <(ldd "$PTOAS_BIN" 2>/dev/null | awk "/=> \/llvm-workspace\// {print \$3}")
              
              # Create wrapper script
              cat > /output/ptoas << "WRAPPER_EOF"
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="${SCRIPT_DIR}/lib:${LD_LIBRARY_PATH}"
          exec "${SCRIPT_DIR}/bin/ptoas" "$@"
          WRAPPER_EOF
              chmod +x /output/ptoas
              
              echo "=== ptoas distribution ==="
              ls -la /output/
              ls -la /output/bin/
              echo "Collected $(ls /output/lib/*.so* 2>/dev/null | wc -l) .so files"
              du -sh /output/lib/
            '

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ptoas-wheels-${{ matrix.arch }}
          path: wheelhouse/*.whl

      - name: Upload ptoas binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ptoas-bin-${{ matrix.arch }}
          path: ptoas-dist/

  collect_artifacts:
    name: Collect all artifacts
    needs: build_wheel
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-wheels
          pattern: ptoas-wheels-*
          merge-multiple: true

      - name: Download all ptoas binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-ptoas-bin
          pattern: ptoas-bin-*
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "=== Wheels ==="
          ls -la all-wheels/
          echo "=== ptoas binaries ==="
          ls -laR all-ptoas-bin/

      - name: Upload combined wheels
        uses: actions/upload-artifact@v4
        with:
          name: ptoas-wheels-all
          path: all-wheels/*.whl

      - name: Upload combined ptoas binaries
        uses: actions/upload-artifact@v4
        with:
          name: ptoas-bin-all
          path: all-ptoas-bin/
